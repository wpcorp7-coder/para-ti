<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para ti ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #160018, #430044, #8b006d);
      color: white;
      text-align: center;
      padding: 25px;
    }

    .caja {
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    p {
      font-size: 19px;
      line-height: 1.5;
      opacity: 0.9;
    }

    button {
      margin-top: 25px;
      border: none;
      border-radius: 30px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: #72005d;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="caja">
    <h1>Tengo algo para ti ❤️</h1>

    <p>
      Sé que tardé un poco en contestarte...
      pero esta vez tenía una razón.
    </p>

    <button onclick="continuar()">Ábrelo ❤️</button>
  </div>

  <script>
    function continuar() {
      alert("Esto apenas empieza ❤️");
    }
  </script>

</body>
</html>
